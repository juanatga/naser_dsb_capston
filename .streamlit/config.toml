# Streamlit settings used locally and on Streamlit Community Cloud.

[theme]
# Charts are styled for a light surface, so the app is pinned to the light theme.
base = "light"
primaryColor = "#2a78d6"          # matches chart series 1
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f3"
textColor = "#0b0b0b"

[client]
toolbarMode = "viewer"            # hide developer options (and the Deploy button) for visitors
showErrorDetails = "none"         # no tracebacks shown to the public; see the server logs instead

[browser]
gatherUsageStats = false

[server]
runOnSave = false
